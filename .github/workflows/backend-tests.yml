name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build backend test image
        run: docker build -f backend/Dockerfile.test -t l-uploader-backend-tests backend

      - name: Run all backend tests
        run: docker run --rm l-uploader-backend-tests
